{% extends "admin/layout.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card mx-auto mt-12 max-w-md p-8">
  <h1 class="text-2xl">Sign in</h1>
  <p class="mt-2 text-sm text-muted">The password is the OTG_ADMIN_PASSWORD you started the tool with.</p>
  <form method="post" class="mt-6 space-y-4">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <div>
      <label for="password" class="mb-1 block text-sm font-medium">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" class="w-full rounded-lg border border-line px-3 py-2 focus:border-ink focus:outline-none">
    </div>
    <button type="submit" class="btn btn--primary w-full">Sign in</button>
  </form>
</div>
{% endblock %}
