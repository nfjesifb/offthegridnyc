<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="0; url={{ target }}">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="{{ site.url }}{{ target }}">
  <title>Redirecting to {{ site.name }}</title>
</head>
<body>
  <p>This page has moved to <a href="{{ target }}">{{ site.url }}{{ target }}</a>.</p>
</body>
</html>
