{% extends "base.html" %}
{% block content %}
<section class="section">
  <div class="wrap max-w-3xl text-center">
    <p class="eyebrow text-accent-strong">404</p>
    <h1 class="section-title mt-2">Truly off the grid.</h1>
    <p class="mt-4 text-muted">That page doesn't exist, or it moved when we rebuilt the site. Try the map, the directory, or a search.</p>
    <form class="search mx-auto mt-6" role="search" action="/locations/" method="get" data-no-submit data-redirect-search>
      <label for="notfound-search" class="sr-only">Search places</label>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="notfound-search" name="q" type="search" placeholder="Search places">
    </form>
    <div class="mt-8 flex flex-wrap justify-center gap-3">
      <a class="btn btn--primary" href="/#explorer">Open the map</a>
      <a class="btn btn--ghost" href="/locations/">Browse all places</a>
    </div>
  </div>
</section>
{% endblock %}
